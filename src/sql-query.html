<script type="text/javascript">
    (function () {
        function integerValidator(label, minimum, maximum) {
            return function (v, opt) {
                var number = Number(v);
                var valid =
                    (typeof v === 'string' || typeof v === 'number') &&
                    String(v).trim() !== '' &&
                    Number.isSafeInteger(number) &&
                    number >= minimum &&
                    number <= maximum;
                return (
                    valid ||
                    (opt ? label + ' must be an integer from ' + minimum + ' to ' + maximum : false)
                );
            };
        }

        function typedValidator(typeField, fallbackType, allowedTypes, allowBlank) {
            return function (v, opt) {
                var type = this[typeField] || fallbackType;
                var input = $('#node-input-' + typeField);
                var stack = RED.editor.getEditStack();
                var editingThisNode = stack.some(function (node) {
                    return node.id === this.id;
                }, this);
                if (editingThisNode && input.length) type = input.val() || type;
                if (allowedTypes.indexOf(type) === -1)
                    return opt ? 'Unsupported type: ' + type : false;
                if (allowBlank && (v === '' || v === undefined || v === null)) return true;
                if (typeof v !== 'string' || !v.trim())
                    return opt ? 'A non-empty value is required' : false;
                return RED.validators.typedInput({ type: type }).call(this, v, opt);
            };
        }

        RED.nodes.registerType('database-sql-query', {
            category: 'storage',
            color: '#5C6B73',
            paletteLabel: 'SQL - Query',
            defaults: {
                name: { value: '' },
                config: {
                    value: '',
                    type: 'database-sql-config',
                    required: true,
                    label: 'SQL Connection',
                },
                statement: {
                    value: 'SELECT 1',
                    required: true,
                    label: 'Statement',
                    validate: typedValidator(
                        'statementType',
                        'str',
                        ['str', 'msg', 'flow', 'global', 'jsonata', 'env'],
                        false,
                    ),
                },
                statementType: { value: 'str' },
                parameters: {
                    value: 'params',
                    required: false,
                    label: 'Parameters',
                    validate: typedValidator(
                        'parametersType',
                        'msg',
                        ['msg', 'flow', 'global', 'json', 'jsonata', 'env'],
                        true,
                    ),
                },
                parametersType: { value: 'msg' },
                output: {
                    value: 'payload',
                    required: true,
                    label: 'Output',
                    validate: typedValidator('outputType', 'msg', ['msg', 'flow', 'global'], false),
                },
                outputType: { value: 'msg' },
                timeoutMs: {
                    value: 30000,
                    required: true,
                    label: 'Query timeout',
                    validate: integerValidator('Query timeout', 1, 2147483647),
                },
                enableLogging: { value: false },
            },
            inputs: 1,
            outputs: 1,
            icon: 'font-awesome/fa-database',
            label: function () {
                return this.name || 'SQL - Query';
            },
            oneditprepare: function () {
                $('#node-input-statement').typedInput({
                    default: 'str',
                    types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env'],
                    typeField: $('#node-input-statementType'),
                });
                $('#node-input-parameters').typedInput({
                    default: 'msg',
                    types: ['msg', 'flow', 'global', 'json', 'jsonata', 'env'],
                    typeField: $('#node-input-parametersType'),
                });
                $('#node-input-output').typedInput({
                    default: 'msg',
                    types: ['msg', 'flow', 'global'],
                    typeField: $('#node-input-outputType'),
                });
            },
        });
    })();
</script>

<script type="text/markdown" data-help-name="database-sql-query">
Executes parameterized SQL using the selected shared SQL Connection.

### Parameter syntax

**PostgreSQL** uses `$1`, `$2`, ... with an array of parameter values.

**MySQL / MariaDB** uses `?` with an array of parameter values.

**Microsoft SQL Server** uses named parameters such as `@id` with an object, or `@p1`, `@p2`, ... with an array.

### Timeouts and parameters

Timeout is a positive integer in milliseconds, up to 2147483647. It is passed to the database driver for query execution; connection establishment and pool queueing can add time. It is not an end-to-end message deadline, and a timeout does not guarantee a database rollback.

Leave Parameters blank for no parameters. Environment parameters must contain a JSON array (PostgreSQL/MySQL) or object/array (SQL Server).

### Output

The configured **Output To** receives one object containing `data` (the returned rows), `driver`, `rowCount`, and `rowsAffected`. Driver-specific metadata such as `command`, `insertId`, and `fields` is included when available.

For **Output To** = `msg.payload`, read rows from `msg.payload.data` and statistics from `msg.payload.rowCount` and `msg.payload.rowsAffected`. The same object is written when targeting flow or global context.

SQL Server uses the first recordset as `data`. PostgreSQL uses the last result's rows when a statement returns multiple results.

### Security

Use parameters for values instead of concatenating untrusted input into SQL strings. Parameters do not substitute database identifiers such as table or column names.
</script>
