<script type="text/javascript">
    (function () {
        function integerValidator(label, minimum, maximum) {
            return function (v, opt) {
                var number = Number(v);
                var valid =
                    (typeof v === 'string' || typeof v === 'number') &&
                    String(v).trim() !== '' &&
                    Number.isSafeInteger(number) &&
                    number >= minimum &&
                    number <= maximum;
                return (
                    valid ||
                    (opt ? label + ' must be an integer from ' + minimum + ' to ' + maximum : false)
                );
            };
        }

        RED.nodes.registerType('database-sql-config', {
            category: 'config',
            defaults: {
                name: { value: '' },
                driver: {
                    value: 'postgres',
                    required: true,
                    label: 'Driver',
                    validate: function (v) {
                        return ['postgres', 'mysql', 'mssql'].indexOf(v) !== -1;
                    },
                },
                host: {
                    value: '',
                    required: true,
                    label: 'Host',
                    validate: function (v) {
                        return typeof v === 'string' && v.trim() !== '';
                    },
                },
                port: {
                    value: 5432,
                    required: true,
                    label: 'Port',
                    validate: integerValidator('Port', 1, 65535),
                },
                database: {
                    value: '',
                    required: true,
                    label: 'Database',
                    validate: function (v) {
                        return typeof v === 'string' && v.trim() !== '';
                    },
                },
                username: {
                    value: '',
                    required: true,
                    label: 'Username',
                    validate: function (v) {
                        return typeof v === 'string' && v.trim() !== '';
                    },
                },
                ssl: { value: false },
                allowSelfSigned: { value: false },
                poolMax: {
                    value: 10,
                    required: true,
                    label: 'Max connections',
                    validate: integerValidator('Max connections', 1, 2147483647),
                },
                connectionTimeoutMs: {
                    value: 10000,
                    required: true,
                    label: 'Connect timeout',
                    validate: integerValidator('Connect timeout', 1, 2147483647),
                },
                idleTimeoutMs: {
                    value: 30000,
                    required: true,
                    label: 'Idle timeout',
                    validate: integerValidator('Idle timeout', 0, 2147483647),
                },
            },
            credentials: {
                password: { type: 'password' },
            },
            label: function () {
                return this.name || this.database || 'SQL Connection';
            },
            oneditprepare: function () {
                var defaultPorts = { postgres: 5432, mysql: 3306, mssql: 1433 };
                var previousDriver = this.driver || 'postgres';

                $('#node-config-input-driver').on('change', function () {
                    var driver = $(this).val();
                    var currentPort = Number($('#node-config-input-port').val());
                    var previousDefault = defaultPorts[previousDriver];
                    if (!currentPort || currentPort === previousDefault) {
                        $('#node-config-input-port').val(defaultPorts[driver]);
                    }
                    previousDriver = driver;
                });

                function updateTlsRows() {
                    $('#row-allow-self-signed').toggle($('#node-config-input-ssl').prop('checked'));
                }

                $('#node-config-input-ssl').on('change', updateTlsRows);
                updateTlsRows();
            },
        });
    })();
</script>

<script type="text/markdown" data-help-name="database-sql-config">
Shared SQL database connection configuration.

### Supported databases

- **PostgreSQL**
- **MySQL / MariaDB**
- **Microsoft SQL Server**

Connections are pooled and reused by all SQL Query nodes that reference this config node.

### TLS

Enable **Use TLS / encrypted connection** when the database server requires TLS.

**Allow self-signed / untrusted server certificate** disables certificate verification. Use this only for controlled development environments.

### Timeouts

All timeout values use milliseconds. Connection and query timeouts must be positive integers; idle timeout may be zero to disable idle eviction. Maximum: 2147483647 ms. Idle cleanup is periodic, not an exact deadline. For MySQL, enabling idle eviction also caps retained idle connections at one less than Max Connections.

### Credentials

A password may be left blank when the database authentication permits it. The password is stored using Node-RED's credential storage and is not exported as a normal node property.
</script>
